<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Shop Mini App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 400px; margin: auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0088cc; }
        .tab { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .tab button { flex: 1; padding: 10px; border: none; background: #ddd; cursor: pointer; font-weight: bold; }
        .tab button.active { background: #0088cc; color: white; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        .btn { width: 100%; background: #28a745; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #218838; }
        .hidden { display: none; }
        #previewContainer { margin-top: 10px; text-align: center; }
        #imagePreview { width: 100%; max-height: 350px; object-fit: contain; border-radius: 8px; border: 2px dashed #0088cc; display: none; padding: 5px; background: #fafafa; }
    </style>
</head>
<body>

<div class="container">
    <h2>💎 TON Store</h2>
    
    <div class="tab">
        <button id="buyTabBtn" class="active" onclick="switchTab('buy')">ဝယ်ယူရန်</button>
        <button id="historyTabBtn" onclick="switchTab('history')">မှတ်တမ်း</button>
    </div>

    <!-- Buy Tab -->
    <div id="buySection">
        <div class="form-group">
            <label>ဝယ်ယူမည့် TON ပမာဏ</label>
            <input type="number" id="tonAmount" value="1" min="0.1" step="0.1" oninput="calculateTotal()">
        </div>
        <div class="form-group">
            <label>ကျသင့်ငွေ (MMK)</label>
            <input type="text" id="totalMmk" readonly style="background: #e9ecef; font-weight: bold; color: #d9534f;">
        </div>

        <div class="form-group">
            <label>ငွေပေးချေမည့် နည်းလမ်း</label>
            <select id="payMethod">
                <option value="KPay / Wave">KPay / Wave (Manual with Screenshot)</option>
            </select>
        </div>

        <div style="font-size: 13px; background: #fff3cd; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
            📌 <b>ငွေလွှဲရန် အကောင့်များ:</b><br>
            • KBZ Pay: <b>09751288906</b><br>
            • Wave Money: <b>09751288906</b><br>
            (ငွေလွှဲပြီးပါက ပြေစာပုံနှင့် Tran ID တင်ပေးပါ။)
        </div>

        <div class="form-group">
            <label>ငွေလွှဲ Tran ID (သို့) ဖုန်းနံပါတ်နောက်ဆုံး ၆ လုံး</label>
            <input type="text" id="tranId" placeholder="ဥပမာ - 123456">
        </div>
        
        <div class="form-group">
            <label>ငွေလွှဲပြေစာ ပုံ (Screenshot)</label>
            <input type="file" id="receiptImage" accept="image/*" onchange="previewFile()">
            <div id="previewContainer">
                <img id="imagePreview" alt="Receipt Preview">
            </div>
        </div>

        <div class="form-group">
            <label>လက်ခံမည့် Wallet Address (Tonkeeper)</label>
            <input type="text" id="manualWallet" placeholder="EQ... your wallet address">
        </div>
        
        <button class="btn" onclick="submitOrder()">အော်ဒါတင်မည်</button>
    </div>

    <!-- History Tab -->
    <div id="historySection" class="hidden">
        <h3>ဝယ်ယူခဲ့သည့် မှတ်တမ်းများ</h3>
        <div id="historyList">ဒေတာများကို ရှာဖွေနေသည်...</div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const FIREBASE_REST_URL = "https://ton-buy-bot-default-rtdb.firebaseio.com";
    let currentTonPrice = 7000;

    async function fetchPrice() {
        try {
            let res = await fetch(`${FIREBASE_REST_URL}/ton_price.json`);
            let data = await res.json();
            if (data) currentTonPrice = data;
            calculateTotal();
        } catch (e) {
            console.error(e);
        }
    }

    function calculateTotal() {
        let amount = document.getElementById('tonAmount').value || 0;
        document.getElementById('totalMmk').value = (amount * currentTonPrice).toLocaleString() + " MMK";
    }

    function previewFile() {
        const preview = document.getElementById('imagePreview');
        const file = document.getElementById('receiptImage').files[0];
        const reader = new FileReader();

        reader.onloadend = function () {
            preview.src = reader.result;
            preview.style.display = 'block';
        }

        if (file) {
            reader.readAsDataURL(file);
        } else {
            preview.src = '';
            preview.style.display = 'none';
        }
    }

    function switchTab(tab) {
        if (tab === 'buy') {
            document.getElementById('buySection').classList.remove('hidden');
            document.getElementById('historySection').classList.add('hidden');
            document.getElementById('buyTabBtn').classList.add('active');
            document.getElementById('historyTabBtn').classList.remove('active');
        } else {
            document.getElementById('buySection').classList.add('hidden');
            document.getElementById('historySection').classList.remove('hidden');
            document.getElementById('historyTabBtn').classList.add('active');
            document.getElementById('buyTabBtn').classList.remove('active');
            loadHistory();
        }
    }

    async function submitOrder() {
        let amount = document.getElementById('tonAmount').value;
        let tranId = document.getElementById('tranId').value;
        let wallet = document.getElementById('manualWallet').value;
        let imageFile = document.getElementById('receiptImage').files[0];

        if (!tranId || !wallet || !imageFile) {
            alert('အချက်အလက်များနှင့် ငွေလွှဲပြေစာ ပုံကို အပြည့်အစုံ ဖြည့်စွက်ပါ။');
            return;
        }

        let reader = new FileReader();
        reader.readAsDataURL(imageFile);
        reader.onload = async function () {
            let base64Image = reader.result;
            
            let orderData = {
                tonAmount: amount,
                totalMmk: amount * currentTonPrice,
                walletAddress: wallet,
                tranId: tranId,
                receiptImage: base64Image,
                status: 'pending',
                method: 'KPay / Wave',
                userId: tg.initDataUnsafe?.user?.id || '12345',
                name: tg.initDataUnsafe?.user?.first_name || 'User',
                username: tg.initDataUnsafe?.user?.username || 'unknown',
                timestamp: Date.now()
            };

            await fetch(`${FIREBASE_REST_URL}/orders.json`, {
                method: 'POST',
                body: JSON.stringify(orderData),
                headers: { 'Content-Type': 'application/json' }
            });

            alert('အော်ဒါတင်ခြင်း အောင်မြင်ပါသည်။ Admin အတည်ပြုသည်နှင့် TON ရောက်ရှိပါမည်။');
            tg.close();
        };
    }

    async function loadHistory() {
        let userId = tg.initDataUnsafe?.user?.id || '12345';
        let res = await fetch(`${FIREBASE_REST_URL}/orders.json`);
        let data = await res.json();
        let listEl = document.getElementById('historyList');
        listEl.innerHTML = '';

        if (!data) {
            listEl.innerHTML = '<p>မှတ်တမ်း မရှိသေးပါ။</p>';
            return;
        }

        Object.values(data).forEach(order => {
            if (order.userId == userId) {
                listEl.innerHTML += `
                    <div style="background:#f8f9fa; padding:10px; margin-bottom:8px; border-radius:6px; border-left:4px solid ${order.status==='approved'?'28a745':'ffc107'}">
                        <b>💎 ${order.tonAmount} TON</b> (${order.totalMmk.toLocaleString()} MMK)<br>
                        Status: <b>${order.status}</b><br>
                        <small>နည်းလမ်း: KPay / Wave</small>
                    </div>
                `;
            }
        });
    }

    fetchPrice();
</script>

</body>
</html>
