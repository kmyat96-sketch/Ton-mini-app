<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy TON Crystal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .title { font-size: 20px; font-weight: bold; text-align: center; color: #38bdf8; margin-bottom: 4px; }
        .subtitle { font-size: 13px; text-align: center; color: #94a3b8; margin-bottom: 16px; }
        
        .pay-info {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 13px;
        }
        .pay-title { font-weight: bold; color: #fbbf24; margin-bottom: 8px; }
        .pay-row { display: flex; justify-content: space-between; margin-bottom: 6px; color: #cbd5e1; }
        
        .input-group { margin-bottom: 12px; text-align: left; }
        label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; }
        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        .buy-btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        .buy-btn:disabled {
            background-color: #334155;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="title">💎 Buy TON Crystal</div>
        <div class="subtitle">KBZPay / Wave Pay ဖြင့် ဝယ်ယူရန်</div>

        <!-- ငွေလွှဲရမည့် အကောင့်များ -->
        <div class="pay-info">
            <div class="pay-title">📌 ငွေလွှဲရမည့် အကောင့်များ</div>
            <div class="pay-row"><span>KBZPay:</span> <strong>09897775612</strong></div>
            <div class="pay-row"><span>Wave Pay:</span> <strong>09784000463</strong></div>
        </div>

        <!-- ဝယ်ယူသူ ဖြည့်စွက်ရမည့် Form -->
        <div class="input-group">
            <label>ဝယ်ယူလိုသော TON ပမာဏ:</label>
            <input type="number" id="ton-amount" placeholder="ဥပမာ - 5" step="0.1">
        </div>

        <div class="input-group">
            <label>သင်၏ TON Wallet Address (ငွေလက်ခံမည့်လိပ်စာ):</label>
            <input type="text" id="ton-address" placeholder="UQ... သို့မဟုတ် EQ...">
        </div>

        <div class="input-group">
            <label>KBZPay / Wave Pay Transaction ID (နောက်ဆုံး ၆ လုံး):</label>
            <input type="text" id="tran-id" placeholder="ဥပမာ - 123456">
        </div>

        <button type="button" class="buy-btn" id="submit-btn" onclick="submitOrder()">အော်ဒါ တင်မည်</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const BOT_TOKEN = "8727961800:AAH0MwVr819OM8d0JtC8cbMTYPvM6yWLqhI"; 
        const ADMIN_CHAT_ID = "1551804446"; 

        function submitOrder() {
            const amount = document.getElementById('ton-amount').value;
            const address = document.getElementById('ton-address').value;
            const tranId = document.getElementById('tran-id').value;
            const user = tg.initDataUnsafe ? tg.initDataUnsafe.user : null;

            if(!amount || !address || !tranId) {
                alert('ကျေးဇူးပြု၍ အချက်အလက်များ အကုန်လုံး ဖြည့်စွက်ပေးပါခင်ဗျာ။');
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.innerText = "ခဏစောင့်ပါ...";
            btn.disabled = true;

            const username = (user && user.username) ? "@" + user.username : "Username မရှိပါ";
            const firstName = (user && user.first_name) ? user.first_name : "Customer";
            
            const message = "🛒 *အော်ဒါအသစ် ရောက်ရှိပါသည်။*\n\n" +
                            "👤 ဝယ်ယူသူ: " + firstName + " (" + username + ")\n" +
                            "💎 ပမာဏ: " + amount + " TON\n" +
                            "👛 Wallet Address:\n`" + address + "`\n\n" +
                            "🧾 Tran ID: `" + tranId + "`";

            // Direct XMLHttpRequest ( reliable for mobile webviews )
            const xhr = new XMLHttpRequest();
            const url = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage";
            
            xhr.open("POST", url, true);
            xhr.setRequestHeader("Content-Type", "application/json");

            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        alert("အော်ဒါ အချက်အလက်များ အောင်မြင်စွာ ရောက်ရှိသွားပါပြီ။ ငွေစစ်ဆေးပြီးပါက TON လွှဲပေးပါမည်။");
                        try { tg.close(); } catch(e){}
                    } else {
                        alert("အော်ဒါ ပို့ဆောင်ရာတွင် အမှားအယွင်းရှိနေပါသည်။ (Error Code: " + xhr.status + ")");
                        btn.innerText = "အော်ဒါ တင်မည်";
                        btn.disabled = false;
                    }
                }
            };

            const data = JSON.stringify({
                chat_id: ADMIN_CHAT_ID,
                text: message,
                parse_mode: 'Markdown'
            });

            xhr.send(data);
        }
    </script>
</body>
</html>
