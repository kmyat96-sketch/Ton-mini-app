<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy TON Crystal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .title { font-size: 20px; font-weight: bold; text-align: center; color: #38bdf8; margin-bottom: 4px; }
        .subtitle { font-size: 13px; text-align: center; color: #94a3b8; margin-bottom: 16px; }
        
        .pay-info {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 13px;
        }
        .pay-title { font-weight: bold; color: #fbbf24; margin-bottom: 8px; }
        .pay-row { display: flex; justify-content: space-between; margin-bottom: 6px; color: #cbd5e1; }
        
        .input-group { margin-bottom: 12px; text-align: left; }
        label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; }
        input[type="number"], input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[type="file"] {
            padding: 8px;
            font-size: 12px;
            color: #94a3b8;
        }
        .buy-btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        .buy-btn:disabled {
            background-color: #334155;
            color: #94a3b8;
        }
        #preview-img {
            width: 100%;
            max-height: 150px;
            object-fit: contain;
            margin-top: 8px;
            border-radius: 6px;
            display: none;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="title">💎 Buy TON Crystal</div>
        <div class="subtitle">KBZPay / Wave Pay ဖြင့် ဝယ်ယူရန်</div>
