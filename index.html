<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy TON Crystal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .tabs {
            display: flex;
            margin-bottom: 16px;
            border-bottom: 1px solid #334155;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: #94a3b8;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        .tab-btn.active {
            color: #38bdf8;
            border-bottom: 2px solid #38bdf8;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .title { font-size: 20px; font-weight: bold; text-align: center; color: #38bdf8; margin-bottom: 4px; }
        .subtitle { font-size: 13px; text-align: center; color: #94a3b8; margin-bottom: 16px; }
        
        .pay-info {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 13px;
        }
        .pay-title { font-weight: bold; color: #fbbf24; margin-bottom: 8px; }
        .pay-row { display: flex; justify-content: space-between; margin-bottom: 6px; color: #cbd5e1; }
        
        .input-group { margin-bottom: 12px; text-align: left; }
        label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; }
        input[type="number"], input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[type="file"] {
            padding: 8px;
            font-size: 12px;
            color: #94a3b8;
        }
        .buy-btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        .buy-btn:disabled {
            background-color: #334155;
            color: #94a3b8;
        }

        #preview-img {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            margin-top: 8px;
            border-radius: 8px;
            display: none;
            border: 1px solid #38bdf8;
            background-color: #0f172a;
        }

        .history-item {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 12px;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .status-waiting {
            background-color: #f59e0b;
            color: #000;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
        }
        .history-detail { color: #94a3b8; margin-bottom: 4px; word-break: break-all; }
        .empty-history { text-align: center; color: #64748b; padding: 20px 0; font-size: 13px; }
        
        .order-count-badge {
            font-size: 12px;
            color: #38bdf8;
            background-color: #0f172a;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-bottom: 12px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('buy-tab')">💎 TON ဝယ်ယူရန်</button>
            <button class="tab-btn" onclick="switchTab('history-tab')">📋 အော်ဒါ မှတ်တမ်း</button>
        </div>

        <div id="buy-tab" class="tab-content active">
            <div class="title">Buy TON Crystal</div>
            <div class="subtitle">KBZPay / Wave Pay ဖြင့် ဝယ်ယူရန်</div>

            <div class="pay-info">
                <div class="pay-title">📌 ငွေလွှဲရမည့် အကောင့်များ</div>
                <div class="pay-row"><span>KBZPay:</span> <strong id="display-kpay">...</strong></div>
                <div class="pay-row"><span>Wave Pay:</span> <strong id="display-wave">...</strong></div>
            </div>

            <div class="input-group">
                <label>ဝယ်ယူလိုသော TON ပမာဏ:</label>
                <input type="number" id="ton-amount" placeholder="ဥပမာ - 5" step="0.1">
            </div>

            <div class="input-group">
                <label>သင်၏ TON Wallet Address (ငွေလက်ခံမည့်လိပ်စာ):</label>
                <input type="text" id="ton-address" placeholder="UQ... သို့မဟုတ် EQ...">
            </div>

            <div class="input-group">
                <label>KBZPay / Wave Pay Transaction ID (နောက်ဆုံး ၆ လုံး):</label>
                <input type="text" id="tran-id" placeholder="ဥပမာ - 123456" maxlength="10">
            </div>

            <div class="input-group">
                <label>ငွေလွှဲပြေစာ (Receipt Photo) ထည့်ရန်:</label>
                <input type="file" id="receipt-file" accept="image/*" onchange="previewImage(event)">
                <img id="preview-img" alt="Receipt Preview">
            </div>

            <button type="button" class="buy-btn" id="submit-btn" onclick="submitOrder()">အော်ဒါ တင်မည်</button>
        </div>

        <div id="history-tab" class="tab-content">
            <div class="title">Order History</div>
            <div class="subtitle" style="margin-bottom: 8px;">သင့်အော်ဒါများ၏ Status အခြေအနေ</div>
            
            <div id="order-count-container" class="order-count-badge">
                📊 စုစုပေါင်း အော်ဒါ: 0 ခု
            </div>

            <div id="history-list"></div>
        </div>
    </div>

    <script>
        // ==================== OWNER CONFIGURATION ====================
        const BOT_TOKEN = "8727961800:AAH0MwVr819OM8d0JtC8cbMTYPvM6yWLqhI"; 
        const ADMIN_CHAT_ID = "1551804446"; 
        const KPAY_NUMBER = "09897775612";
        const WAVEPAY_NUMBER = "09784000463";
        // =============================================================

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        document.getElementById('display-kpay').innerText = KPAY_NUMBER;
        document.getElementById('display-wave').innerText = WAVEPAY_NUMBER;

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if(tabId === 'buy-tab') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                loadOrderHistory();
            }
            document.getElementById(tabId).classList.add('active');
        }

        function previewImage(event) {
            const input = event.target;
            const preview = document.getElementById('preview-img');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function saveOrderToLocal(order) {
            let orders = JSON.parse(localStorage.getItem('ton_orders') || '[]');
            orders.unshift(order);
            localStorage.setItem('ton_orders', JSON.stringify(orders));
        }

        function loadOrderHistory() {
            const historyList = document.getElementById('history-list');
            const countBadge = document.getElementById('order-count-container');
            let orders = JSON.parse(localStorage.getItem('ton_orders') || '[]');

            countBadge.innerText = `📊 စုစုပေါင်း အော်ဒါ: (${orders.length}) ခု`;

            if(orders.length === 0) {
                historyList.innerHTML = '<div class="empty-history">အော်ဒါ မှတ်တမ်း မရှိသေးပါခင်ဗျာ။</div>';
                return;
            }

            let html = '';
            orders.forEach((ord) => {
                html += `<div class="history-item">
                    <div class="history-header">
                        <span>💎 ${ord.amount} TON</span>
                        <span class="status-waiting">⏳ Waiting</span>
                    </div>
                    <div class="history-detail">🧾 Tran ID: ${ord.tranId}</div>
                    <div class="history-detail">👛 Wallet: ${ord.address.substring(0, 8)}...${ord.address.substring(ord.address.length - 6)}</div>
                    <div class="history-detail" style="font-size: 10px; color: #64748b; margin-top: 4px;">📅 ${ord.date}</div>
                </div>`;
            });
            historyList.innerHTML = html;
        }

        // Special Characters များကြောင့် HTML Error မတက်အောင် Escape ပြုလုပ်ပေးသည့် Function
        function escapeHtml(text) {
            if (!text) return "";
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function submitOrder() {
            const amount = document.getElementById('ton-amount').value;
            const address = document.getElementById('ton-address').value.trim();
            const tranId = document.getElementById('tran-id').value.trim();
            const fileInput = document.getElementById('receipt-file');
            const user = tg.initDataUnsafe ? tg.initDataUnsafe.user : null;

            if(!amount || !address || !tranId) {
                alert('ကျေးဇူးပြု၍ ပမာဏ၊ Address နှင့် Transaction ID တို့ကို ဖြည့်စွက်ပေးပါခင်ဗျာ။');
                return;
            }

            const digitsOnly = tranId.replace(/\D/g, '');
            if (digitsOnly.length < 6) {
                alert('⚠️ Transaction ID (နောက်ဆုံး ၆ လုံး) ကို မှန်ကန်စွာ ဂဏန်း ၆ လုံး ပြည့်အောင် ဖြည့်ပေးပါခင်ဗျာ။');
                document.getElementById('tran-id').focus();
                return;
            }

            if (!fileInput.files || !fileInput.files[0]) {
                alert('⚠️️ ကျေးဇူးပြု၍ ငွေလွှဲပြေစာ (Receipt Screenshot) ဓာတ်ပုံ ထည့်သွင်းပေးပါခင်ဗျာ။');
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.innerText = "ပြေစာပုံအား စစ်ဆေးနေပါသည်...";
            btn.disabled = true;

            try {
                const imageFile = fileInput.files[0];
                const worker = await Tesseract.createWorker('eng');
                const ret = await worker.recognize(imageFile);
                await worker.terminate();

                const extractedText = ret.data.text;

                if (!extractedText.includes(digitsOnly)) {
                    alert('❌ ရိုက်ထည့်ထားသော Tran ID (' + digitsOnly + ') သည် ငွေလွှဲပြေစာ ပုံပါ နံပါတ်နှင့် မတူညီပါ။ ကျေးဇူးပြု၍ ပြန်လည်စစ်ဆေးပါ။');
                    btn.innerText = "အော်ဒါ တင်မည်";
                    btn.disabled = false;
                    return;
                }
            } catch (err) {
                console.log("OCR Error:", err);
            }

            btn.innerText = "ခဏစောင့်ပါ...";

            const username = (user && user.username) ? "@" + escapeHtml(user.username) : "Username မရှိပါ";
            const firstName = (user && user.first_name) ? escapeHtml(user.first_name) : "Customer";
            
            const nanoAmount = Math.round(parseFloat(amount) * 1000000000);
            const tonkeeperUrl = "https://app.tonkeeper.com/transfer/" + address + "?amount=" + nanoAmount;

            // HTML Mode သို့ ပြောင်းလဲထားသော မက်ဆေ့ချ်
            const captionMessage = `🛒 <b>အော်ဒါအသစ် ရောက်ရှိပါသည်။</b>\n\n` +
                                   `👤 ဝယ်ယူသူ: ${firstName} (${username})\n` +
                                   `💎 ပမာဏ: ${amount} TON\n` +
                                   `👛 Wallet Address:\n<code>${escapeHtml(address)}</code>\n\n` +
                                   `🧾 Tran ID (နောက်ဆုံး၆လုံး): <code>${escapeHtml(tranId)}</code>`;

            const replyMarkup = JSON.stringify({
                inline_keyboard: [
                    [{ text: "📲 Send TON via Tonkeeper", url: tonkeeperUrl }]
                ]
            });

            const newOrder = {
                amount: amount,
                address: address,
                tranId: tranId,
                status: 'Waiting',
                date: new Date().toLocaleString()
            };

            const handleSuccess = () => {
                saveOrderToLocal(newOrder);
                alert("အော်ဒါ အချက်အလက်များ အောင်မြင်စွာ ရောက်ရှိသွားပါပြီ။ အော်ဒါ မှတ်တမ်းတွင် Status စစ်ဆေးနိုင်ပါသည်။");
                switchTab('history-tab');
                btn.innerText = "အော်ဒါ တင်မည်";
                btn.disabled = false;
            };

            const formData = new FormData();
            formData.append("chat_id", ADMIN_CHAT_ID);
            formData.append("photo", fileInput.files[0]);
            formData.append("caption", captionMessage);
            formData.append("parse_mode", "HTML"); // Markdown အစား HTML ပြောင်းလိုက်သည့်အတွက် Underscore (_) ကြောင့် Error မတက်တော့ပါ
            formData.append("reply_markup", replyMarkup);

            try {
                const res = await fetch("https://api.telegram.org/bot" + BOT_TOKEN + "/sendPhoto", {
                    method: "POST",
                    body: formData
                });
                if(res.ok) {
                    handleSuccess();
                } else {
                    const errData = await res.json();
                    alert("Error: " + (errData.description || "အော်ဒါ ပို့ဆောင်ရာတွင် အမှားအယွင်းရှိနေပါသည်"));
                    btn.innerText = "အော်ဒါ တင်မည်";
                    btn.disabled = false;
                }
            } catch (err) {
                alert("ကွန်ရက် ချိတ်ဆက်မှု အမှားအယွင်း ရှိနေပါသည်။");
                btn.innerText = "အော်ဒါ တင်မည်";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
