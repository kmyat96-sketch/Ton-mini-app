<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Buy Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #18222d;
            --card-bg: #232e3c;
            --text-color: #ffffff;
            --accent-color: #2ea6ff;
            --secondary-color: #2b3847;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        /* Tabs */
        .tabs {
            display: flex;
            background: var(--secondary-color);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #8c9ba5;
            padding: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: var(--accent-color);
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        /* Card & Form */
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .price-banner {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #2ea6ff, #0077cc);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #a8b2bc;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background: var(--bg-color);
            border: 1px solid #3b4b5e;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
        }
        .payment-info {
            background: rgba(46, 166, 255, 0.1);
            border-left: 4px solid var(--accent-color);
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .btn-primary {
            width: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        /* History Item */
        .history-item {
            background: var(--bg-color);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 13px;
            border-left: 4px solid #ffc107;
        }
        .history-item.success { border-left-color: #28a745; }
        .history-item.rejected { border-left-color: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Tabs Navigation -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('buy')">💎 TON ဝယ်ရန်</button>
            <button class="tab-btn" onclick="switchTab('history')">📜 History</button>
        </div>

        <!-- TAB 1: TON ဝယ်ရန် -->
        <div id="buy-tab" class="tab-content active">
            <div class="card">
                <div class="price-banner" id="priceDisplay">1 TON = Loading...</div>
                
                <div class="form-group">
                    <label>ဝယ်ယူလိုသော TON ပမာဏ</label>
                    <input type="number" id="tonAmount" placeholder="ဥပမာ - 2" min="0.1" step="any" oninput="calculateTotal()">
                </div>

                <div class="form-group">
                    <label>ကျသင့်ငွေ (MMK)</label>
                    <input type="text" id="totalMmk" readonly value="0 MMK" style="color: #4cd137; font-weight: bold;">
                </div>

                <div class="form-group">
                    <label>သင်၏ TON Wallet Address</label>
                    <input type="text" id="walletAddress" placeholder="UQ... ဖြင့်စသော your wallet address">
                </div>

                <!-- ငွေလွှဲရန် ဖုန်းနံပါတ်များ -->
                <div class="payment-info">
                    <b>📌 ငွေလွှဲရန် နံပါတ်များ:</b><br>
                    • KPay: <span id="kpayNum">09751288906</span> (Kaung Ko Ko Thant)<br>
                    • WavePay: <span id="waveNum">09751288906</span> (Kaung Ko Ko Thant)
                </div>

                <div class="form-group">
                    <label>ငွေလွှဲ Tran ID (နောက်ဆုံး ၆ လုံး)</label>
                    <input type="text" id="tranId" placeholder="ဥပမာ - 123456" maxlength="6">
                </div>

                <div class="form-group">
                    <label>ငွေလွှဲပြေစာ (Screenshot) တင်ရန်</label>
                    <input type="file" id="receiptFile" accept="image/*">
                </div>

                <button class="btn-primary" onclick="submitOrder()">📤 TON အော်ဒါ တင်မည်</button>
            </div>
        </div>

        <!-- TAB 2: History -->
        <div id="history-tab" class="tab-content">
            <div class="card">
                <h3>ဝယ်ယူခဲ့မှု မှတ်တမ်းများ</h3>
                <div id="historyList">မှတ်တမ်းများ ရှာမတွေ့သေးပါ...</div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Firebase Configuration (သင့်ရဲ့ Database URL ထည့်ပါ)
        const firebaseConfig = {
            databaseURL: "https://ton-buy-bot-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentRate = 15500; // Default price

        // Real-time ဈေးနှုန်းဆွဲထုတ်ခြင်း
        db.ref('ton_price').on('value', (snapshot) => {
            const val = snapshot.val();
            if (val) {
                currentRate = Number(val);
                document.getElementById('priceDisplay').innerText = `1 TON = ${currentRate.toLocaleString()} MMK`;
                calculateTotal();
            }
        });

        function calculateTotal() {
            const ton = parseFloat(document.getElementById('tonAmount').value) || 0;
            const total = ton * currentRate;
            document.getElementById('totalMmk').value = total.toLocaleString() + " MMK";
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if(tabName === 'buy') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('buy-tab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('history-tab').classList.add('active');
                loadHistory();
            }
        }

        function submitOrder() {
            const ton = document.getElementById('tonAmount').value;
            const wallet = document.getElementById('walletAddress').value;
            const tranId = document.getElementById('tranId').value;

            if (!ton || !wallet || !tranId) {
                alert('အချက်အလက်များကို အပြည့်အစုံ ဖြည့်စွက်ပေးပါ!');
                return;
            }

            const user = tg.initDataUnsafe?.user || { id: 12345, first_name: "User", username: "unknown" };
            const totalMmk = ton * currentRate;

            const orderData = {
                userId: user.id,
                name: user.first_name,
                username: user.username || 'NoUsername',
                tonAmount: ton,
                totalMmk: totalMmk,
                walletAddress: wallet,
                tranId: tranId,
                status: 'pending',
                timestamp: Date.now()
            };

            // Firebase သို့ အော်ဒါပို့ခြင်း
            db.ref('orders').push(orderData).then(() => {
                alert('အော်ဒါတင်ခြင်း အောင်မြင်ပါသည်။ Admin အတည်ပြုချက်ကို စောင့်ဆိုင်းပေးပါ။');
                // Bot ဆီသို့ အကြောင်းကြားချက် ပို့ရန် (သို့မဟုတ် ပြီးဆုံးကြောင်းပြရန်)
                switchTab('history');
            }).catch(err => {
                alert('အမှားအယွင်းရှိသည်: ' + err.message);
            });
        }

        function loadHistory() {
            const user = tg.initDataUnsafe?.user || { id: 12345 };
            db.ref('orders').orderByChild('userId').equalTo(user.id).on('value', (snapshot) => {
                const historyList = document.getElementById('historyList');
                historyList.innerHTML = '';
                
                const val = snapshot.val();
                if (!val) {
                    historyList.innerHTML = 'ဝယ်ယူထားသော မှတ်တမ်း မရှိသေးပါ။';
                    return;
                }

                Object.values(val).reverse().forEach(order => {
                    let statusText = 'စောင့်ဆိုင်းဆဲ (Pending)';
                    let statusClass = '';
                    if(order.status === 'approved') {
                        statusText = 'အောင်မြင်သည် (Approved)';
                        statusClass = 'success';
                    } else if(order.status === 'rejected') {
                        statusText = 'ပယ်ချခံရသည် (Rejected)';
                        statusClass = 'rejected';
                    }

                    const div = document.createElement('div');
                    div.className = `history-item ${statusClass}`;
                    div.innerHTML = `
                        <b>💎 ပမာဏ:</b> ${order.tonAmount} TON (${order.totalMmk.toLocaleString()} MMK)<br>
                        <b>📌 Tran ID:</b> ${order.tranId}<br>
                        <b>🔹 အခြေအနေ:</b> ${statusText}
                    `;
                    historyList.appendChild(div);
                });
            });
        }
    </script>
</body>
</html>
